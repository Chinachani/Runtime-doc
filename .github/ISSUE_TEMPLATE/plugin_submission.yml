name: 📦 插件入驻与版本更新提审
description: 提交第三方或官方扩展插件入驻 QQ Runtime 官方插件市场
title: "[Plugin Submission]: "
labels: ["plugin-submission"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您为 QQ Runtime 生态贡献插件！
        建议在框架后台“已安装插件”中点击“申请上架”或插件市场点击“申请发布插件”自动生成本表单内容。
        提交本工单后，CI 机器人将自动校验您的 Release ZIP、哈希与依赖，通过后将自动上架分发到所有节点的插件市场！
  - type: input
    id: plugin_id
    attributes:
      label: 插件标识 (Plugin ID)
      description: 必须以 plugin. 开头，例如 plugin.word2ppt
      placeholder: plugin.my_awesome_plugin
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 插件版本号 (Version)
      description: 语义化版本号，例如 1.0.0
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: download_url
    attributes:
      label: 插件包下载链接 (Download URL)
      description: 必须为公网可访问的 ZIP 下载直链（推荐 GitHub Releases 附件直链）
      placeholder: https://github.com/<owner>/<repo>/releases/download/v1.0.0/plugin.xxx.zip
    validations:
      required: true
  - type: input
    id: sha256
    attributes:
      label: 安全 SHA-256 校验哈希 (SHA-256 Hash)
      description: 插件 ZIP 包的 SHA-256 哈希值（64位小写十六进制字符串）
      placeholder: 38625540849c419c6dc668c08a3ca414636a07edda91299a5f5bff2ede6c35ed
    validations:
      required: true
  - type: input
    id: repo_url
    attributes:
      label: 开源仓库链接 (Repo URL)
      description: 插件开源主页
      placeholder: https://github.com/<owner>/<repo>
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 插件市场分类 (Category)
      options:
        - tools
        - utility
        - ai
        - entertainment
        - other
    validations:
      required: true
  - type: input
    id: icon
    attributes:
      label: 插件图标 (Icon)
      description: 显示在市场的 Emoji 图标
      placeholder: 🚀
    validations:
      required: false
  - type: textarea
    id: market_json
    attributes:
      label: 生成的 market.json 配置清单 (Market Config Snippet)
      description: 可直接粘贴在管理台复制的 JSON 片段
      render: json
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: 开发者合规承诺
      options:
        - label: 我确认该插件符合 QQ 官方机器人平台规范及法律法规，不包含恶意挖矿、后门、后门提权等代码。
          required: true
        - label: 我确认该插件已在本地 QQ Runtime 环境中完成基本功能测试与沙箱测试。
          required: true
